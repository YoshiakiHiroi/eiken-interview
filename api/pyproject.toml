[project]
name = "eiken-api"
version = "0.1.0"
description = "Backend API for the Eiken speaking test practice app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "firebase-admin>=7.7.0",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-storage>=3.17.1",
    "google-genai>=2.34.0",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eiken_api"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["eiken_api", "tests", "../scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
